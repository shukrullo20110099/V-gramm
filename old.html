<style>
/* Layout: dark-first glass interface. Profile is a clean header plus photo grid; one gear button opens a settings page that holds create, profile, appearance, language, privacy and account in order. Floating glass dock without labels. Six languages, RTL for Arabic and Persian. */
:root { --fs: 1;

  color-scheme: dark;

    --glass: rgba(255, 255, 255, 0.55); --glass-2: rgba(255, 255, 255, 0.85); --glass-line: rgba(15, 20, 34, 0.13); --glass-hi: inset 0 1px 0 rgba(255, 255, 255, 0.95);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edf0f7; --surface: #ffffff; --fg: #0f1422; --muted: #5b657b; --line: #d6dcea; --danger: #c4261d; --ok: #14935f;
  --glass: rgba(255, 255, 255, 0.55); --glass-2: rgba(255, 255, 255, 0.85); --glass-line: rgba(15, 20, 34, 0.13); --glass-hi: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  color-scheme: light;

.topbar { display: flex; align-items: center; justify-content: space-between; }

.ring { width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: conic-gradient(from 200deg, var(--accent), #8b5cf6, #22d3ee, var(--accent)); position: relative; }

.profile { padding: 0; overflow: hidden; position: relative; }
.cover { height: 116px; background:

  linear-gradient(90deg, rgba(255,255,255,0.14) 1px, transparent 1px) 0 0 / 22px 22px,
  linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #000)); }

/* v29 Instagram theme */
:root{--bg:#000;--surface:#121212;--fg:#f5f5f5;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.18);--accent:#0095f6;--accent-ink:#fff;--danger:#ed4956;--ok:#3ddc97;--glass:rgba(255,255,255,.14);--glass-2:rgba(255,255,255,.24);--glass-line:rgba(255,255,255,.3);--glass-hi:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.05);--font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans SC",Helvetica,Arial,sans-serif;--font-mono:var(--font-body)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#fdf2fb;--surface:#fff;--fg:#262626;--muted:#5f5f5f;--line:rgba(38,38,38,.14);--danger:#ed4956;--ok:#1c9b4f;--glass:rgba(255,255,255,.5);--glass-2:rgba(255,255,255,.8);--glass-line:rgba(38,38,38,.14);--glass-hi:inset 0 1px 0 rgba(255,255,255,.95);color-scheme:light}}

body{background:linear-gradient(160deg,#1b0b45 0%,#5b2a9e 32%,#c2347f 66%,#f0793f 100%) fixed;min-height:100vh}

.reply-bar[hidden]{display:none}
.rb-t{flex:1;min-width:0;display:flex;flex-direction:column;font-size:calc(13px * var(--fs))}
.rb-t b{font-weight:600}
.rb-t span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt{border-inline-start:3px solid rgba(255,255,255,.7);background:rgba(0,0,0,.18);border-radius:8px;padding:4px 8px;margin-bottom:6px;font-size:calc(12px * var(--fs));display:flex;flex-direction:column}
.qt b{font-weight:600}
.qt span{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.s-seen{align-self:center;background:rgba(40,40,40,.8);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:600;font-size:calc(15px * var(--fs))}
.s-seen[hidden]{display:none!important}
#seen-m{z-index:30}

.seen-sum{font-size:calc(20px * var(--fs));font-weight:700;margin:4px 0 8px;letter-spacing:.02em}

/* v44 swipe reply */
.msg{touch-action:pan-y}
.rpw{display:flex;flex-direction:column;max-width:78%;gap:0}
.rpw.me{align-self:flex-end;align-items:flex-end}
.rpw.them{align-self:flex-start;align-items:flex-start}
.rpw .msg{max-width:100%;position:relative;z-index:1}
.rp-label{font-size:calc(12px * var(--fs));color:var(--muted);padding:0 6px 4px}
.rp-q{max-width:100%;display:flex;flex-direction:column;gap:6px;background:var(--glass);border-radius:18px;padding:10px 14px 18px;margin-bottom:-12px;opacity:.9;font-size:calc(14px * var(--fs));overflow:hidden}
.rp-q img{width:84px;height:104px;object-fit:cover;border-radius:10px}
.rp-q span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.reply-bar{background:none;border-radius:0;border-inline-start:0;border-top:1px solid var(--glass-line);padding:10px 16px}
.rb-t b{font-weight:400;color:var(--muted)}
.rb-t span{color:var(--fg);font-weight:600;font-size:calc(15px * var(--fs))}
.rb-img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
.rb-img[hidden]{display:none}

.sw-ar{position:absolute;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;background:var(--glass-2);display:grid;place-items:center;opacity:0;pointer-events:none;font-size:16px;color:var(--fg)}
.msg{-webkit-user-drag:none}

/* v47 dock + privacy eye */
.dock{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column}
.dock .compose{position:static;bottom:auto}
.dock .reply-bar{background:var(--surface);border-radius:14px 14px 0 0;margin-bottom:-8px;padding-bottom:16px}
.thread-h .ic{width:40px;height:40px;flex:none}
body.hidec .msg,body.hidec .gname,body.hidec .rp-q,body.hidec .rp-label,body.hidec .reply-bar .rb-t span{filter:blur(7px);transition:filter .15s}
body.hidec .msg:active,body.hidec .msg:active ~ *,body.hidec .rpw:active .msg{filter:none}
body.hidec .drow .mid span{filter:blur(6px)}
body.hidec #t-input{-webkit-text-security:disc;text-security:disc}
#t-eye[aria-pressed="true"]{color:var(--accent)}

.cr-rules{color:rgba(255,255,255,.6);font-size:calc(12px * var(--fs));margin:0}
</style>

        c.appendChild(mk('h1', null, t('adm_claim_t'))); c.appendChild(mk('p', 'sub', t('adm_claim_d', { u: '@' + ownerName() })));
        var bt = mk('button', 'btn primary', t('adm_claim')); bt.type = 'button'; bt.style.cssText = 'margin-top:16px;width:100%';
        var armed = false;
        bt.addEventListener('click', function () { if (!armed) { armed = true; bt.textContent = t('adm_claim_sure'); return; } try { localStorage.setItem('vgram.owner', state.user.username); } catch (e) {} openAdmin(); });
        c.appendChild(bt);
      });
      return;
    }
    openPanel(t('ad_title'), function (b) {
      var g = mk('div', 'ad-grid'); b.appendChild(g);
      adminStats().forEach(function (r, i) { var tile = mk('div', 'ad-tile' + (i < 2 ? ' hi' : '')); tile.appendChild(mk('b', null, String(r[1]))); tile.appendChild(mk('span', null, r[0])); g.appendChild(tile); });
      b.appendChild(mk('p', 'hint', t('ad_demo')));
      b.appendChild(mk('p', 'slabel', t('ad_manage')));
      var box = mk('div', 'plist'); b.appendChild(box);
      var acc = accounts(); if (!acc.length) box.appendChild(mk('p', 'hint', t('ad_none')));
      acc.forEach(function (a) {
        var row = mk('div', 'ad-acc'); var w = mk('div', 'ad-who'); w.appendChild(mk('b', null, a.name || a.username)); w.appendChild(mk('small', null, '@' + a.username + (a.banned ? ' · ' + t('mod_banned') : '') + (a.verified > Date.now() ? ' ✔' : ''))); row.appendChild(w);
        function upd(fn) { var l = accounts(); l.forEach(function (x) { if (x.username === a.username) fn(x); }); try { localStorage.setItem('vgram.accounts', JSON.stringify(l)); var sn = localStorage.getItem('vgram.acc.' + a.username); if (sn) { var o = JSON.parse(sn); fn(o); if (o.user) fn(o.user === o ? o : o.user, true); localStorage.setItem('vgram.acc.' + a.username, JSON.stringify(o)); } } catch (e) {} if (state.user && state.user.username === a.username) { fn(state, false); } }
        var bb = mk('button', 'btn', a.banned ? t('ad_unban') : t('ad_ban')); bb.type = 'button';
        bb.addEventListener('click', function () { if (a.username === state.user.username) return; upd(function (x, isUser) { if (!isUser) { x.banned = !a.banned; if (a.banned) x.strikes = 0; } }); openAdmin(); });
        var vb = mk('button', 'btn', (a.verified > Date.now()) ? t('ad_take') : t('ad_give')); vb.type = 'button';
        vb.addEventListener('click', function () { var on = a.verified > Date.now(); var nv = on ? 0 : Date.now() + 30 * 864e5; upd(function (x, isUser) { if (isUser) x.verified = nv; else if (x !== state) x.verified = nv; }); if (state.user.username === a.username) { state.user.verified = nv; save(); } openAdmin(); paintVerify(); });
        var br = mk('div', 'ad-btns'); br.appendChild(bb); br.appendChild(vb); row.appendChild(br); box.appendChild(row);
      });
    });
  }
  $('set-verify').addEventListener('click', openVerify);
  $('set-admin').addEventListener('click', openAdmin);
  function logout() {
    var u = state.user; if (!u) return;
    try { localStorage.setItem('vgram.acc.' + u.username, JSON.stringify(state)); } catch (e) { toast(t('t_full')); return; }
    saveAccount({ username: u.username, name: u.name, pw: u.pw, contact: u.email || u.phone || null });
    var lang = state.lang, ls = state.langSet;
    state = { user: null, color: COLORS[0], posts: [], chats: null, liked: {}, story: null, comments: {}, reels: [], stats: {}, following: {}, saved: {}, reposts: {}, highlights: [], blocked: {}, followers: {}, reqs: {}, votes: {}, hidden: {}, pins: {}, restricted: {}, groups: [], close: {}, fixed: {}, strikes: 0, banned: false, notifSeen: false, settings: defaultSettings(), lang: lang, langSet: ls };
    seen = {}; tab = 'home'; save(); toast(t('out_done')); render();
  }
  $('set-out').addEventListener('click', logout);
  $('ban-out').addEventListener('click', logout);
  $('ph-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var digits = $('ph-num').value.replace(/\D/g, '');
    if (digits.length < 6 || digits.length > 12) { showErr('ph-err', t('ob_bad_phone')); return; }
    showErr('ph-err', '');
    ob.phone = $('ph-cc').value + ' ' + digits; ob.via = 'phone'; ob.contact = ob.phone;
    onbGo('code');
  });
  function startCodeStep() {
    ob.code = String(Math.floor(100000 + Math.random() * 900000));
    var isMail = ob.via === 'email';
    $('wa').querySelector('i').textContent = isMail ? '@' : 'W'; $('wa').querySelector('b').textContent = isMail ? 'Gmail' : 'WhatsApp';
    document.querySelector('[data-step="code"] .onb-back').setAttribute('data-ob-back', ob.mode === 'recover' ? 'recover' : (isMail ? 'email' : 'phone'));
    $('code-sub').textContent = isMail ? t('cd_mail_sub', { to: ob.contact }) : t('ob_code_sub', { num: ob.contact || ob.phone });
    $('code-in').value = ''; showErr('code-err', '');
    var wa = $('wa'), msg = $('wa-msg'); wa.classList.add('wait'); msg.textContent = '…';
    ob.wa = setTimeout(function () { wa.classList.remove('wait'); msg.textContent = t('ob_wa_msg', { code: ob.code }); }, 1100);
    var left = 30, rs = $('code-resend'); rs.disabled = true; rs.textContent = t('ob_resend_in', { n: left });
    ob.timer = setInterval(function () {
      left -= 1;
      if (left <= 0) { clearInterval(ob.timer); rs.disabled = false; rs.textContent = t('ob_resend'); }
      else rs.textContent = t('ob_resend_in', { n: left });
    }, 1000);
  }
  $('code-resend').addEventListener('click', function () { if (!$('code-resend').disabled) startCodeStep(); });
  function checkCode() {
    var v = $('code-in').value.replace(/\D/g, '');
    if (v === ob.code) { showErr('code-err', ''); if (ob.mode === 'recover') onbGo('newpw'); else finishSignup(); }
    else { showErr('code-err', t('ob_wrong')); }
  }
  $('code-in').addEventListener('input', function (e) {
    var v = e.target.value.replace(/\D/g, '').slice(0, 6); if (v !== e.target.value) e.target.value = v;
    if (v.length === 6) checkCode();
  });
  $('code-form').addEventListener('submit', function (e) { e.preventDefault(); checkCode(); });

  function renderSuggest() {
    var box = $('ob-sug'); box.textContent = '';
    PEOPLE.forEach(function (p) {
      var row = document.createElement('div'); row.className = 'sugrow';
      row.appendChild(personAv(p));
      var who = document.createElement('div'); who.className = 'who';
      var b = document.createElement('b'); b.appendChild(document.createTextNode(pname(p)));
      var vb = document.createElement('span'); vb.className = 'vbadge'; vb.setAttribute('role', 'img'); vb.setAttribute('aria-label', t('ob_verified')); b.appendChild(vb);
      var sm = document.createElement('small'); sm.textContent = '@' + p.user + ' · ' + fmtN(BASE_FOL[p.id]) + ' ' + t('followers_w');
      var bio = document.createElement('small'); bio.textContent = t('bio_' + p.id);
      who.appendChild(b); who.appendChild(sm); who.appendChild(bio); row.appendChild(who);
      var fb = document.createElement('button'); fb.type = 'button';
      function paint() { var on = !!state.following[p.id]; fb.className = on ? 'btn' : 'btn primary'; fb.textContent = t(on ? 'following' : 'follow'); }
      fb.addEventListener('click', function () { if (state.following[p.id]) delete state.following[p.id]; else state.following[p.id] = true; save(); paint(); });
      paint(); row.appendChild(fb); box.appendChild(row);
    });
  }
  $('ob-sug-next').addEventListener('click', function () { onbGo('photo'); });
  $('ob-sug-skip').addEventListener('click', function () { onbGo('photo'); });

  function renderObPhoto() {
    var av = $('ob-av'); av.textContent = '';
    if (ob.src) { var im = document.createElement('img'); im.src = ob.src; im.alt = ''; av.appendChild(im); }
    else av.textContent = initial(state.user.name);
    $('ob-pick').textContent = t(ob.src ? 'ob_done' : 'ob_choose');
    $('ob-skip').hidden = !!ob.src;
  }
  $('ob-pick').addEventListener('click', function () {
    if (ob.src) { state.user.avatar = ob.src; if (!save()) { return; } ob.src = null; onbDone(); }
    else $('ob-file').click();
  });
  $('ob-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    readImage(f, 256, true).then(function (src) { ob.src = src; renderObPhoto(); }).catch(function () { toast(t('t_notimage')); });
  });
  $('ob-skip').addEventListener('click', function () { ob.src = null; onbDone(); });

  /* events */
  $('f-user').addEventListener('input', function (e) { var v = normUser(e.target.value); if (v !== e.target.value) e.target.value = v; });
  $('signup-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('f-name').value.trim(), uname = normUser($('f-user').value);
    if (!name) { showErr('signup-err', t('err_name')); $('f-name').focus(); return; }
    if (uname.length < 3) { showErr('signup-err', t('err_user')); $('f-user').focus(); return; }
    if (accounts().some(function (x) { return x.username === uname; })) { showErr('signup-err', t('user_taken')); $('f-user').focus(); return; }
    showErr('signup-err', '');
    ob.draft = { name: name, username: uname, bio: $('f-bio').value.trim() };
    onbGo('password');
  });

  document.querySelectorAll('#nav [data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { show(b.getAttribute('data-tab')); });
  });
  $('tb-add').addEventListener('click', function () { openCreate('post', true); });
  $('tb-chat').addEventListener('click', function () { show('chats'); });
  $('s-q').addEventListener('input', renderSearch);
  $('t-back').addEventListener('click', function () { show('chats'); });
  $('compose').addEventListener('submit', function (e) {
    e.preventDefault();
    if (rec.on) { recStop(true); return; }
    var v = $('t-input').value.trim(); if (!v) return;
    $('t-input').value = ''; syncCompose(); sendMsg(v);
  });
  $('t-voice').addEventListener('click', function () { startCall(false); });
  $('t-video').addEventListener('click', function () { startCall(true); });
  $('call-end').addEventListener('click', endCall);
  $('call-mic').addEventListener('click', function () {
    var b = $('call-mic'); b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  });
  $('call-cam').addEventListener('click', function () {
    var b = $('call-cam'), off = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', off ? 'true' : 'false');
    $('pip').style.opacity = off ? '0.35' : '1';
  });
  $('live-end').addEventListener('click', endLive);

  $('s-close').addEventListener('click', function (e) { e.stopPropagation(); closeStory(); });
  $('s-card').addEventListener('click', function () { openStory(storyIdx + 1); });
  $('story').addEventListener('click', function (e) { if (e.target === $('story')) closeStory(); });

  $('v-close').addEventListener('click', closeViewer);
  $('viewer').addEventListener('click', function (e) { if (e.target === $('viewer')) closeViewer(); });
  $('v-cap').addEventListener('change', function () {
    var p = state.posts[openIndex]; if (!p) return;
    p.caption = $('v-cap').value.trim(); save(); renderGrid();
  });
  $('v-like').addEventListener('click', function () {
    var p = state.posts[openIndex]; if (!p) return;
    toggleLike('p' + p.t); setLikeBtn('p' + p.t);
  });
  $('v-share').addEventListener('click', function () {
    var p = state.posts[openIndex]; if (!p) return;
    openShare({ key: 'p' + p.t, kind: 'post' });
  });
  $('v-del').addEventListener('click', function () {
    if (openIndex < 0) return;
    var dk = 'p' + state.posts[openIndex].t; delete state.comments[dk]; delete state.stats[dk]; delete state.liked[dk]; state.posts.splice(openIndex, 1); save(); closeViewer(); renderGrid(); toast(t('t_deleted'));
  });

  $('e-cancel').addEventListener('click', closeEditor);
  $('editor').addEventListener('click', function (e) { if (e.target === $('editor')) closeEditor(); });
  $('e-pick').addEventListener('click', function () { $('e-file').click(); });
  $('e-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    readImage(f, 256, true).then(function (src) {
      editAvatar = src; setAvatar($('e-avatar'), { name: $('e-name').value || state.user.name }, src);
    }).catch(function () { toast(t('t_notimage')); });
  });
  $('e-clear').addEventListener('click', function () {
    editAvatar = null; setAvatar($('e-avatar'), { name: $('e-name').value || state.user.name }, null);
  });
  $('e-save').addEventListener('click', function () {
    var first = $('e-name').value.trim(), last = $('e-last').value.trim(), name = (first + ' ' + last).trim();
    if (!first) { showErr('e-err', t('err_name')); $('e-name').focus(); return; }
    if (modCheck(first + ' ' + last + ' ' + $('e-bio').value)) { violation(); return; }
    var u = state.user, prev = { name: u.name, first: u.first, last: u.last, bio: u.bio, avatar: u.avatar };
    u.name = name; u.first = first; u.last = last; u.bio = $('e-bio').value.trim();
    if (editAvatar !== undefined) u.avatar = editAvatar;
    if (!save()) { u.name = prev.name; u.first = prev.first; u.last = prev.last; u.bio = prev.bio; u.avatar = prev.avatar; return; }
    closeEditor(); toast(t('t_saved'));
    if (tab === 'profile') renderProfile();
  });
  $('btn-editp').addEventListener('click', openEditor);

  $('btn-settings').addEventListener('click', function () { show('settings'); });
  $('set-back').addEventListener('click', function () { show('profile'); });
  $('set-post').addEventListener('click', function () { openCreate('post', true); });
  $('set-story').addEventListener('click', function () { openCreate('story', true); });
  $('set-reel').addEventListener('click', function () { openCreate('reel', true); });
  $('set-live').addEventListener('click', startLive);
  $('set-edit').addEventListener('click', openEditor);
  document.querySelectorAll('#theme-seg [data-theme-val]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.settings.theme = b.getAttribute('data-theme-val'); applyTheme(); save(); renderSettings();
    });
  });
  $('sw-private').addEventListener('click', function () {
    state.settings.private = !state.settings.private; save(); renderSettings(); toast(t(state.settings.private ? 'priv_on' : 'priv_off'));
  });
  $('sw-notif').addEventListener('click', function () {
    state.settings.notif = !state.settings.notif; save(); renderSettings();
  });
  $('set-del').addEventListener('click', function () { $('set-confirm').hidden = false; $('set-del').hidden = true; });
  $('set-no').addEventListener('click', function () { $('set-confirm').hidden = true; $('set-del').hidden = false; });
  $('set-yes').addEventListener('click', resetAccount);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('pw-modal').hidden) closePwModal();
    else if (!$('pmenu').hidden) closePm();
    else if (!$('hl-view').hidden) closeHlView();
    else if (!$('hl-new').hidden) closeHlNew();
    else if (!$('attach').hidden) closeAttach();
    else if (!$('plist-m').hidden) closePl();
    else if (!$('notifs').hidden) closeNotifs();
    else if (!$('share').hidden) closeShare();
    else if (!$('comments').hidden) closeComments();
    else if (!$('create').hidden) closeCreate();
    else if (!$('reel').hidden) closeReel();
    else if (live) endLive();
    else if (call) endCall();
    else if (!$('story').hidden) closeStory();
    else if (!$('viewer').hidden) closeViewer();
    else if (!$('editor').hidden) closeEditor();
  });

  document.querySelectorAll('[data-ic]').forEach(function (b) {
    var size = parseInt(b.getAttribute('data-size'), 10) || (b.classList.contains('addb') ? 26 : 24);
    b.innerHTML = ic(b.getAttribute('data-ic'), size);
  });
  buildSwatches();
  load();
  applyLang();
  render();
  setInterval(refreshStats, 8000);
})();
</script>

</body></html>
