<style>
/* Layout: dark-first glass interface. Profile is a clean header plus photo grid; one gear button opens a settings page that holds create, profile, appearance, language, privacy and account in order. Floating glass dock without labels. Six languages, RTL for Arabic and Persian. */
:root { --fs: 1;

  color-scheme: dark;
}

    --glass: rgba(255, 255, 255, 0.55); --glass-2: rgba(255, 255, 255, 0.85); --glass-line: rgba(15, 20, 34, 0.13); --glass-hi: inset 0 1px 0 rgba(255, 255, 255, 0.95);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edf0f7; --surface: #ffffff; --fg: #0f1422; --muted: #5b657b; --line: #d6dcea; --danger: #c4261d; --ok: #14935f;
  --glass: rgba(255, 255, 255, 0.55); --glass-2: rgba(255, 255, 255, 0.85); --glass-line: rgba(15, 20, 34, 0.13); --glass-hi: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  color-scheme: light;
