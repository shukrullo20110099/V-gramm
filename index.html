<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#090b11"><title>vgram</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--bg:#1b0b45;--bgg:linear-gradient(160deg,#1b0b45 0%,#5b2a9e 32%,#c2347f 66%,#f0793f 100%);--surface:#121212;--fg:#f5f5f5;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.18);--accent:#0095f6;--ink:#fff;--danger:#ed4956;--ok:#3ddc97;--glass:rgba(255,255,255,.14);--glass2:rgba(255,255,255,.24);--gline:rgba(255,255,255,.3);--ghi:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.05);--sh:0 8px 22px rgba(0,0,0,.28);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#fdf2fb;--bgg:linear-gradient(160deg,#e7d9ff 0%,#ffd1ea 50%,#ffe0b8 100%);--surface:#fff;--fg:#262626;--muted:#5f5f5f;--line:rgba(38,38,38,.14);--accent:#0095f6;--danger:#ed4956;--ok:#1c9b4f;--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.8);--gline:rgba(38,38,38,.14);--ghi:inset 0 1px 0 rgba(255,255,255,.95);--sh:0 8px 22px rgba(120,60,150,.14);color-scheme:light}}
:root[data-theme=light]{--bg:#fdf2fb;--bgg:linear-gradient(160deg,#e7d9ff 0%,#ffd1ea 50%,#ffe0b8 100%);--surface:#fff;--fg:#262626;--muted:#5f5f5f;--line:rgba(38,38,38,.14);--accent:#0095f6;--danger:#ed4956;--ok:#1c9b4f;--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.8);--gline:rgba(38,38,38,.14);--ghi:inset 0 1px 0 rgba(255,255,255,.95);--sh:0 8px 22px rgba(120,60,150,.14);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:var(--bgg)}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;flex:none}
.top h1{margin:0;font-size:20px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:21px;flex:1;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--gline);box-shadow:var(--ghi);position:relative;flex:none}
.ib:active{transform:scale(.94)}
.ib .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--danger)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:76px;contain:layout paint}
#nav{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);height:58px;display:flex;border-radius:22px;background:var(--glass2);border:1px solid var(--gline);box-shadow:var(--ghi),0 10px 30px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);z-index:5}
#nav button{flex:1;display:grid;place-items:center;color:var(--muted);position:relative}
#nav button[aria-current=true]{color:var(--accent)}
#nav .dot{position:absolute;top:10px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:16px;background:var(--glass);border:1px solid var(--gline);box-shadow:var(--ghi);font-weight:500;width:100%}
.btn.primary{background:var(--accent);color:var(--ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:0 14px;border-radius:12px;width:auto;font-size:14px}
.btn:disabled{opacity:.5}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{color:var(--muted);font-size:13px}
input[type=text],input[type=password],input[type=search],textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--gline);outline:none}
textarea{resize:none;min-height:80px}
input:focus,textarea:focus{border-color:var(--accent)}
.err{color:var(--danger);font-size:13px;margin:0 0 10px}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
.card{padding:16px;border-radius:22px;background:var(--glass);border:1px solid var(--gline);box-shadow:var(--ghi);}
.pad{padding:0 14px 14px}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden;background:#334}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:86px;height:86px;font-size:32px}
.av.sm{width:32px;height:32px;font-size:13px}
.bdg{display:inline-block;vertical-align:middle;margin-inline-start:4px;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:start}
.row .who{flex:1;min-width:0}
.row .who b{display:flex;align-items:center;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none;font-size:12px}
.st span{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--accent),#c24fff,#ff6b6b,var(--accent))}
.ring.none{background:var(--line)}
.ring .av{border:2px solid var(--bg);width:58px;height:58px}
.post{margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.post-h{display:flex;align-items:center;gap:10px;padding:8px 14px}
.post-h .who{flex:1;min-width:0;line-height:1.2}
.post-h b{display:flex;align-items:center;font-weight:500}
.post-h small{color:var(--muted);font-size:12px}
.pic{position:relative;background:var(--surface);min-height:240px;display:grid;place-items:center}
.pic img,.pic video{width:100%;display:block;max-height:78vh;object-fit:contain;background:#000}
.acts{display:flex;align-items:center;gap:6px;padding:8px 10px 2px}
.acts button{display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;color:var(--fg)}
.acts button[aria-pressed=true] svg{color:var(--danger);fill:var(--danger)}
.acts span{font-variant-numeric:tabular-nums;font-size:14px}
.cap{padding:2px 14px;white-space:pre-wrap;word-break:break-word}
.cap b{font-weight:600;margin-inline-end:6px}
.lnk{color:var(--muted);padding:4px 14px;display:block;text-align:start}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.ov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;max-width:600px;margin:0 auto;z-index:20;animation:in .18s ease-out}
.ov.sheet{background:color-mix(in srgb,var(--bg) 96%,#000);top:14%;border-radius:24px 24px 0 0;border:1px solid var(--gline);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.ov .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cm{display:flex;gap:10px;padding:8px 14px}
.cm .t{flex:1;min-width:0;word-break:break-word}
.cm b{font-weight:600;margin-inline-end:6px}
.cm small{color:var(--muted);display:block;margin-top:2px}
.cm small button{color:var(--muted);margin-inline-start:12px}
.cm.rep{margin-inline-start:42px}
.cm audio{height:34px;max-width:100%;display:block;margin-top:4px}
.cm img.ci{max-width:70%;border-radius:12px;display:block;margin-top:4px}
.bar{display:flex;gap:8px;align-items:center;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);border-top:1px solid var(--line);flex:none}
.bar input{flex:1;min-height:42px;border-radius:21px}
.bar .ib{width:42px;height:42px;border-radius:50%}
.bar .ib[aria-pressed=true]{background:var(--danger);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid button{aspect-ratio:1;background:var(--surface);overflow:hidden;position:relative}
.grid img{width:100%;height:100%;object-fit:cover}
.stats{display:flex;justify-content:space-around;margin:14px 0}
.stats div{text-align:center}
.stats b{display:block;font-size:18px}
.stats span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;padding:0 14px 10px}
.chip{padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--gline);font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--ink);border-color:transparent}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;margin:3px 12px;word-break:break-word;white-space:pre-wrap;width:fit-content}
.bub.me{margin-inline-start:auto;background:var(--accent);color:var(--ink);border-end-end-radius:6px}
.bub.th{background:var(--glass2);border:1px solid var(--gline);border-end-start-radius:6px}
.bub img{max-width:100%;border-radius:12px;display:block}
.bub audio{height:34px;max-width:220px;display:block}
.bub small{display:block;opacity:.65;font-size:11px;margin-top:2px;text-align:end}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:88%;background:var(--glass2);color:var(--fg);border:1px solid var(--gline);padding:10px 16px;border-radius:14px;z-index:99;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.auth{padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 30px;overflow-y:auto;flex:1}
.auth .logo{font-size:34px;justify-content:center;flex:none;margin:20px 0 6px}
.auth .logo i{width:48px;height:48px;border-radius:14px}
.auth .sub{text-align:center;color:var(--muted);margin:0 0 22px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px;color:var(--muted);font-size:13px}
.chk input{margin-top:3px;width:18px;height:18px;flex:none}
.chk a,.lnkb{color:var(--accent);text-decoration:underline;cursor:pointer;background:none}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.gl .t{display:flex;flex-direction:column;gap:4px;padding:16px 14px;border-radius:20px;min-height:90px;justify-content:space-between;background:var(--glass);border:1px solid var(--gline);box-shadow:var(--ghi);}
.gl .t b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.gl .t span{color:var(--muted);font-size:13px}
.gl .t.hi{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 55%,transparent),color-mix(in srgb,var(--accent) 12%,transparent) 70%)}
.gl .t.hi span{color:var(--fg)}
.acc{display:flex;flex-direction:column;gap:10px;padding:14px;margin:8px 14px;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--gline);box-shadow:var(--ghi)}
.acc .btns{display:flex;gap:8px;flex-wrap:wrap}
.menu{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.menu .m{width:100%;max-width:600px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 14px);border:1px solid var(--gline)}
.menu .m button{display:block;width:100%;padding:15px 12px;text-align:start;border-radius:12px}
.menu .m button.danger{color:var(--danger)}
.sv{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center}
.sv img{max-width:100%;max-height:100%}
.sv .p{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;display:flex;gap:4px}
.sv .p i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.sv .p i b{display:block;height:100%;width:0;background:#fff}
.sv .u{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:12px;display:flex;align-items:center;gap:8px;color:#fff;text-shadow:0 1px 4px #000}
.sv .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:10px;color:#fff}
.sv .cp{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:16px;right:16px;color:#fff;text-align:center;text-shadow:0 1px 6px #000}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .7s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.leg{padding:4px 18px 30px;line-height:1.55}
.leg h3{margin:18px 0 6px}
.leg p,.leg li{color:var(--fg);opacity:.9}
.prev{max-width:100%;max-height:50vh;border-radius:16px;display:block;margin:0 auto 12px}
.ban{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:30px;flex:1}
.pl{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;border:2px solid var(--bg)}

#app.rl #main{padding-bottom:0;overflow:hidden;background:#000}
#v-reels{position:relative;height:100%;background:#000;color:#fff}
.rls{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.rls::-webkit-scrollbar{display:none}
.rl1{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#111}

.rl1 .side button[aria-pressed=true] svg{color:#ff4d6d;fill:#ff4d6d}
.rl1 .meta{position:absolute;left:14px;right:80px;bottom:100px;text-shadow:0 1px 6px rgba(0,0,0,.6)}

.rl1 .meta .u b{font-weight:600}
.rl1 .meta .fb{border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:3px 12px;font-size:13px}
.rl1 .meta p{margin:0;max-height:4.2em;overflow:hidden;word-break:break-word}
.rl1 .pp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}

.rl-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;color:#fff}
.vprev{width:100%;max-height:50vh;border-radius:18px;display:block;margin:0 auto 12px;background:#000}
.sheetx{padding:0}

.ptabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 6px}

.ptabs button[aria-pressed=true]{color:var(--fg);border-bottom-color:var(--fg)}
.logo,.top h1.wm,.rlh h1{font-family:"Grand Hotel",Georgia,serif;font-weight:400;letter-spacing:0}
.logo{font-size:34px;line-height:1}
.ring{background:linear-gradient(45deg,#f9a825,#ee2a7b 55%,#6228d7)}
.ring.none{background:var(--line)}
.pic{margin:0 14px;border-radius:14px;overflow:hidden}
.pic img,.pic video{max-height:70vh}
.bigname{font-family:"Grand Hotel",Georgia,serif;font-size:34px;font-weight:400;padding:0 14px;line-height:1.1}
.handle{color:var(--muted);padding:2px 14px;font-size:14px}
.since{color:var(--muted);padding:0 14px 8px;font-size:12px}
.chatsearch{margin:0 14px 10px;display:block;width:calc(100% - 28px)}
.row.unread .who b{font-weight:700}
.row.unread .who small{color:var(--fg);font-weight:600}
.swt{display:flex;gap:10px;flex-wrap:wrap}
.swt button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.swt button[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.top h1.wm{font-size:34px;line-height:1.1}
.music{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--gline);font-size:13px;max-width:100%}
.music[aria-pressed=true]{background:var(--accent);color:var(--ink);border-color:transparent}
.music span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl1 .mu,.sv .mu{font-size:13px;opacity:.9;margin-bottom:4px}

.cdel{padding:8px 10px!important;margin-inline-start:2px!important;min-height:36px}
.cm small{display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.ib,.btn,.chip{touch-action:manipulation}
#main img{content-visibility:auto}

/* ===== old-look port (phase 1) ===== */
html,body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans SC",Helvetica,Arial,sans-serif;font-size:calc(15px * var(--fs,1))}
body{background:var(--bgg);min-height:100vh}
.ring{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.ring.none{background:var(--gline)}
.ring .av{border-color:rgba(0,0,0,.55)}
#nav{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 32px);max-width:340px;height:58px;border-radius:999px;padding:6px;background:linear-gradient(180deg,var(--glass2),var(--glass));box-shadow:var(--ghi),0 14px 38px rgba(0,0,0,.34)}
#nav button::before{width:46px;height:46px}
.btn{font-weight:600}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,transparent),color-mix(in srgb,var(--accent) 45%,transparent));border:1px solid color-mix(in srgb,var(--accent) 80%,transparent);color:#fff}
.chip[aria-pressed=true]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,transparent),color-mix(in srgb,var(--accent) 36%,transparent));border-color:color-mix(in srgb,var(--accent) 80%,transparent);color:#fff}
.pic{margin:0;border-radius:0}
.pic img,.pic video{max-height:none}
.post{border-bottom:0}
.post-h small{font-size:13px}

/* ===== phase 1 new classes ===== */
.av.lg2{width:68px;height:68px;font-size:24px}
.av.on{box-shadow:0 0 0 2px #3ddc97}
.ov.sheet{background:linear-gradient(160deg,#1b0b45,#3a1a6e);top:12%}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]) .ov.sheet{background:linear-gradient(160deg,#efe4ff,#ffe3f1)}}
:root[data-theme=light] .ov.sheet{background:linear-gradient(160deg,#efe4ff,#ffe3f1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--gline);margin:8px auto}
.sh-t{display:flex;justify-content:space-between;align-items:center;padding:4px 14px 8px;font-weight:700}
.sh-t button{background:none;border:0;color:inherit}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 0}
.pp1{background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;min-width:0}
.pp1 span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp1.sent{opacity:.5}
.sfoot{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sfoot button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--glass);border:1px solid var(--gline);border-radius:14px;color:inherit;padding:10px;font-size:12px}
.pbub{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.25);border:0;border-radius:12px;color:inherit;padding:6px;text-align:start;max-width:240px}
.pbub img,.pbub video{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.pbub .pt{font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.nth{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;margin-inline-start:auto}
.nth img,.nth video{width:100%;height:100%;object-fit:cover}
.tagrow{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.tagrow .chip{flex:none}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:dense;gap:2px}
.mosaic .tl:first-child{grid-column:span 2;grid-row:span 2}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tl{position:relative;aspect-ratio:1;padding:0;border:0;background:#222;overflow:hidden;color:#fff}
.mosaic .tl:first-child{aspect-ratio:auto}
.tl img,.tl video{width:100%;height:100%;object-fit:cover;display:block}
.tl .vi{position:absolute;top:6px;right:6px}
.tst{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;align-items:center;font-size:11px;padding:14px 6px 4px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.sec{padding:6px 14px;font-weight:700}
.svb[aria-pressed=true],.clk[aria-pressed=true]{color:var(--fg)}
.svb[aria-pressed=true] svg{fill:currentColor}
.clk{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;flex:none}
.clk[aria-pressed=true]{color:var(--danger)}
.clk[aria-pressed=true] svg{fill:var(--danger)}
.atag{color:var(--muted);font-size:12px}
.emo{display:flex;justify-content:space-around;padding:6px 10px;border-top:1px solid var(--line)}
.emo button{background:none;border:0;font-size:22px}
.lnk{background:none;border:0;color:var(--muted);font-size:13px;text-align:start;padding-block:4px}
.notes{display:flex;gap:14px;overflow-x:auto;padding:14px 14px 6px;scrollbar-width:none}
.nt{flex:none;background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;width:76px;position:relative;padding-top:30px}
.nt span{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb{position:absolute;top:0;left:50%;transform:translateX(-50%);max-width:76px;background:var(--glass2);border:1px solid var(--gline);border-radius:14px;padding:3px 7px;font-size:11px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--fg)}
.nb.add{font-size:16px;line-height:1}
.rl1 .vw{font-size:12px;opacity:.85;margin-top:4px}
.chatsearch{width:calc(100% - 28px);margin:8px 14px;box-sizing:border-box}

function openLegal(kind) {
  const ov = h('div', { class: 'ov' }), body = h('div', { class: 'body leg' });
  const doc = LEGAL[kind][S.lang] || LEGAL[kind].en;
  doc.forEach(x => body.append(h('h3', null, x[0]), h('p', null, x[1])));
  ov.append(topbar(t(kind), () => closeOv(ov)), body); openOv(ov);
}

/* ===== admin (owner only; every call is checked on the server) ===== */
function openAdmin() {
  const ov = h('div', { class: 'ov' }), body = h('div', { class: 'body' }), tabs = h('div', { class: 'tabs' });
  let tab = 'stats';
  const paintTabs = () => { tabs.textContent = ''; [['stats', t('ad_stats')], ['users', t('ad_users')], ['reports', t('ad_reports')]].forEach(x => tabs.append(h('button', { class: 'chip', 'aria-pressed': tab === x[0] ? 'true' : 'false', onclick: () => { tab = x[0]; paintTabs(); render(); } }, x[1]))); };
  async function render() {
    body.textContent = ''; body.append(spinner());
    try {
      if (tab === 'stats') {
        const s = await rpc('admin_stats'); body.textContent = '';
        const keys = ['users', 'online', 'active24', 'banned', 'posts', 'reels', 'stories', 'comments', 'voice_comments', 'photo_comments', 'likes', 'chats', 'messages', 'voice_msgs', 'photo_msgs', 'reports'];
        body.append(h('div', { class: 'gl' }, keys.map((k, i) => h('div', { class: 't' + (i < 2 ? ' hi' : '') }, h('b', null, fmtN(s[k])), h('span', null, t('s_' + k))))), h('p', { class: 'hint', style: 'padding:10px 14px' }, t('ad_note')));
      } else if (tab === 'users') {
        const q = h('input', { type: 'search', placeholder: t('search_ph'), maxlength: 40 }); let tm = null; const list = h('div');
        const load = async () => {
          list.textContent = ''; list.append(spinner());
          try {
            const rows = await rpc('admin_users', { p_q: q.value }); list.textContent = '';
            rows.forEach(u => {
              const vOn = u.verified_until && Date.parse(u.verified_until) > Date.now();
              list.append(h('div', { class: 'acc' }, h('div', { style: 'min-width:0' }, h('b', null, u.name || u.username), h('div', { class: 'hint', style: 'margin:2px 0 0' }, '@' + u.username + (u.banned ? ' · ' + t('is_banned') : '') + (vOn ? ' ✔' : '') + ' · ' + t('posts') + ': ' + u.post_count + (u.strikes ? ' · ⚠' + u.strikes : ''))),
                h('div', { class: 'btns' },
                  h('button', { class: 'btn sm' + (u.banned ? '' : ' danger'), onclick: async () => { try { await rpc('admin_set', { target: u.id, p_banned: !u.banned, p_reason: u.banned ? null : 'admin', p_verified: u.verified_until }); load(); } catch (e) { toast(errText(e)); } } }, u.banned ? t('unban') : t('ban')),
                  h('button', { class: 'btn sm', onclick: async () => { try { await rpc('admin_set', { target: u.id, p_banned: u.banned, p_reason: u.banned ? 'admin' : null, p_verified: vOn ? null : new Date(Date.now() + 30 * 864e5).toISOString() }); load(); } catch (e) { toast(errText(e)); } } }, vOn ? t('unverify') : t('verify')))));
            });
          } catch (e) { list.textContent = ''; toast(errText(e)); }
        };
        q.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(load, 300); });
        body.textContent = ''; body.append(h('div', { class: 'pad' }, q), list); load();
      } else {
        const rows = await rpc('admin_reports'); body.textContent = '';
        if (!rows.length) body.append(h('div', { class: 'empty' }, t('no_reports')));
        rows.forEach(r => {
          const act = async a => { try { await rpc('admin_resolve', { p_report: r.id, p_action: a }); render(); } catch (e) { toast(errText(e)); } };
          body.append(h('div', { class: 'acc' }, h('div', { class: 'hint', style: 'margin:0' }, r.reason + ' · ' + t('by') + ' @' + r.reporter + (r.target ? ' → @' + r.target : '') + (r.post_hidden ? ' · ' + t('hidden') : '')),
            r.post_url && r.post_type === 'image' ? h('img', { src: thumbOf(r.post_url), alt: '', style: 'max-width:100%;max-height:260px;border-radius:14px;object-fit:contain;align-self:flex-start', onerror: ev => { ev.target.onerror = null; ev.target.src = r.post_url; } }) : null,
            r.post_caption ? h('div', null, r.post_caption) : null,
            h('div', { class: 'btns' }, r.post_id ? h('button', { class: 'btn sm danger', onclick: () => act('delete_post') }, t('delete')) : null, h('button', { class: 'btn sm danger', onclick: () => act('ban') }, t('ban')), h('button', { class: 'btn sm', onclick: () => act('dismiss') }, t('dismiss')))));
        });
      }
    } catch (e) { body.textContent = ''; body.append(h('div', { class: 'empty' }, errText(e))); }
  }
  ov.append(topbar(t('admin'), () => closeOv(ov)), tabs, body); paintTabs(); openOv(ov); render();
}

/* ===== background ticks (online status, ban check, unread dot) ===== */
async function tick() {
  if (document.hidden || !S.me) return;
  try {
    const r = await rpc('me'); if (r && r[0]) { S.me = r[0]; if (S.me.banned) { renderBan(); return; } }
    const cs = await rpc('my_chats'); S.unread = cs.reduce((a, c) => a + Number(c.unread || 0), 0); paintDot();
    try { const n = await rpc('notif_unread'); S.notif = Number(n) || 0; paintNotifDot(); } catch (e) {}
  } catch (e) {}
}
function startTicks() { stopTicks(); S.hb = setInterval(tick, 25000); S.hb2 = setInterval(() => { if (!document.hidden && S.me && S.tab === 'chats' && !OV.length) loadChats(); }, 7000); setTimeout(tick, 1500); }
function stopTicks() { if (S.hb) clearInterval(S.hb); if (S.hb2) clearInterval(S.hb2); S.hb = null; S.hb2 = null; }

/* ===== boot ===== */
function renderOffline() {
  const root = $('#root'); root.textContent = '';
  root.append(h('div', { class: 'ban' }, h('h2', null, t('e_net')), h('button', { class: 'btn', style: 'max-width:260px', onclick: boot }, t('retry'))));
}
async function boot() {
  applyTheme(); applyLangAttr();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyLook); } catch (e) {}
  if (S.ses) {
    try { await afterLogin(); return; }
    catch (e) { if (e && e.code === 'network') { renderOffline(); return; } forceLogout(); return; }
  }
  renderAuth('in');
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) tick(); });
window.addEventListener('DOMContentLoaded', () => { boot(); if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); });
